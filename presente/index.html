<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Um presente para você | Gabriel Lopes</title><link rel="icon" href="https://www.gabriellopespersonal.com.br/favicon.png"><style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--blue:#2e6bea;--light:#5a8eff;--dark:#07090e;--card:#0e131f;--border:#1a2236}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#2e6bea20,transparent 65%),var(--dark);color:#f1f5f9;font:16px/1.6 Inter,sans-serif;min-height:100svh}body:before{content:'';position:fixed;inset:0;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:28px 28px;pointer-events:none}header{position:relative;border-bottom:1px solid var(--border);padding:20px 24px;text-align:center;background:#07090ecc}header img{height:42px;max-width:80%;object-fit:contain}main{position:relative;width:min(100% - 32px,600px);margin:48px auto}h1,h2{font-family:Montserrat,sans-serif;line-height:1.2;letter-spacing:-.035em}h1{font-size:clamp(28px,6vw,40px);font-weight:900;margin:16px 0}h2{font-size:26px;margin:14px 0 12px}p{color:#aab7cb;margin:0 0 24px}.intro{text-align:center;margin-bottom:30px}.badge{display:inline-block;color:#8eb1ff;background:#2e6bea17;border:1px solid #2e6bea55;border-radius:100px;padding:5px 14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.card{background:linear-gradient(145deg,#111827,#0e131f);border:1px solid var(--border);border-radius:28px;padding:30px;box-shadow:0 24px 70px #0005}.progress{display:flex;gap:6px;margin:0 0 26px}.progress span{height:4px;background:#263048;flex:1;border-radius:8px;transition:background .3s}.progress .done{background:var(--blue);box-shadow:0 0 14px #2e6bea60}.eyebrow{font-size:11px;letter-spacing:.12em;color:#8eb1ff;font-weight:700;text-transform:uppercase}label{display:block;font-size:14px;margin:0 0 10px}input{width:100%;font:inherit;background:#07090e88;color:white;border:1px solid #35415a;border-radius:14px;padding:15px 16px}button{font:600 15px Inter,sans-serif;cursor:pointer;color:#f1f5f9;transition:transform .2s,border-color .2s,background .2s;touch-action:manipulation}button:hover{transform:translateY(-2px)}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:wait;transform:none}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #8eb1ff;outline-offset:4px}.primary{width:100%;border:1px solid #4379fa;background:var(--blue);padding:17px 20px;border-radius:14px;box-shadow:0 6px 24px #2e6bea33;margin-top:24px}.primary:hover{background:#1f53cb}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 8px}.choice{border:1px solid #2c3850;background:#131a2b;border-radius:16px;padding:22px 12px;min-height:76px;animation:arrive .35s both}.choice:nth-child(2){animation-delay:50ms}.choice:nth-child(3){animation-delay:100ms}.choice:nth-child(4){animation-delay:150ms}.choice:nth-child(5){animation-delay:200ms}.choice:hover,.choice[aria-pressed=true]{border-color:var(--light);background:#2e6bea26;box-shadow:0 0 24px #2e6bea18}.sizes{grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid #2c3850;border-radius:14px;overflow:hidden}.sizes .choice{font:800 clamp(14px,4vw,20px) Montserrat,sans-serif;min-width:0;min-height:58px;padding:16px 2px;border:0;border-right:1px solid #2c3850;border-radius:0;background:transparent}.sizes .choice:last-child{border-right:0}.sizes .choice:hover,.sizes .choice[aria-pressed=true]{background:#2e6bea33;transform:none}.sizes .choice:focus-visible{outline-offset:-4px}.back,.quiet{background:transparent;border:0;color:#aab7cb;padding:14px 0;margin-top:12px}.back:hover,.quiet:hover{color:white}.step{animation:arrive .3s both}.step[hidden],[hidden]{display:none!important}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.error{color:#ffb6bc;font-size:14px;margin:12px 0 0}.note{text-align:center;color:#78879e;font-size:12px;margin-top:24px}.summary{margin:24px 0 0}.summary div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:12px 0}.summary dt{color:#aab7cb}.summary dd{margin:0;font-weight:600;overflow-wrap:anywhere;text-align:right}.success-icon{width:64px;height:64px;display:grid;place-items:center;background:#2e6bea22;border:1px solid #2e6bea66;color:#8eb1ff;border-radius:20px;font-size:30px;margin:12px auto 24px}.success{text-align:center;padding:18px 0}.wide{max-width:850px;width:calc(100% - 32px)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.toolbar h1{font-size:28px}.response{border:1px solid var(--border);border-radius:18px;background:var(--card);padding:20px;margin:12px 0}.response h2{font:700 17px Inter,sans-serif;margin:0 0 10px;overflow-wrap:anywhere}.response p{margin:0}.response time{display:block;color:#78879e;font-size:12px;margin-top:8px}.tag{display:inline-block;padding:3px 10px;margin:0 6px 4px 0;background:#2e6bea18;color:#9abdff;border-radius:8px;font-size:13px}@media(max-width:480px){main{margin:28px auto}.card{padding:24px 20px;border-radius:24px}.intro{margin-bottom:24px}.intro p{font-size:14px}header{padding:16px}header img{height:36px}.toolbar{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.success-details{display:inline-flex;flex-direction:column;gap:5px;max-width:100%;padding:14px 24px;border:1px solid #2e6bea55;border-radius:18px;background:#2e6bea17;color:#b8ceff;overflow-wrap:anywhere}.success-details strong{font-size:16px;font-weight:600}.success-details span{font-size:13px;color:#8eb1ff}
</style></head>
<body><header><img src="https://www.gabriellopespersonal.com.br/logo.png" alt="Gabriel Lopes"></header><main><div class="intro"><h1>Um presente<br>feito para você.</h1></div><div class="card"><div class="progress" aria-label="Progresso"><span class="done"></span><span></span><span></span><span></span></div><form id="gift-form">
<section class="step" data-step="0"><h2 tabindex="-1">Como você se chama?</h2><input aria-label="Nome completo" id="name" name="name" autocomplete="name" maxlength="100" required><button class="primary" type="submit">Continuar <span aria-hidden="true">→</span></button></section>
<section class="step" data-step="1" hidden><h2 tabindex="-1">Qual modelo você prefere?</h2><div class="choices" role="group" aria-label="Modelo"><button type="button" class="choice" data-model="Feminino" aria-pressed="false">Feminino</button><button type="button" class="choice" data-model="Masculino" aria-pressed="false">Masculino</button></div><button type="button" class="back">← Voltar</button></section>
<section class="step" data-step="2" hidden><h2 tabindex="-1">Qual é o seu tamanho?</h2><!-- A imagem da tabela de tamanhos poderá ser inserida aqui. -->
<div class="choices sizes" role="group" aria-label="Tamanho"><button type="button" class="choice" data-size="P" aria-pressed="false">P</button><button type="button" class="choice" data-size="M" aria-pressed="false">M</button><button type="button" class="choice" data-size="G" aria-pressed="false">G</button><button type="button" class="choice" data-size="GG" aria-pressed="false">GG</button><button type="button" class="choice" data-size="XGG" aria-pressed="false">XGG</button></div><button type="button" class="back">← Voltar</button></section>
<section class="step" data-step="3" hidden><h2 tabindex="-1">Só falta confirmar.</h2><dl class="summary"><div><dt>Nome</dt><dd id="review-name"></dd></div><div><dt>Modelo</dt><dd id="review-model"></dd></div><div><dt>Tamanho</dt><dd id="review-size"></dd></div></dl><button id="send" class="primary" type="submit">Confirmar e enviar <span aria-hidden="true">→</span></button><button type="button" class="back">← Voltar</button></section>
<p id="error" class="error" role="alert" hidden></p></form><section id="success" class="success" hidden><div class="success-icon" aria-hidden="true">✓</div><h2 tabindex="-1">Tudo anotado!</h2><div id="success-details" class="success-details"><strong id="success-name"></strong><span id="success-options"></span></div></section><noscript>Ative o JavaScript do navegador para preencher o formulário.</noscript></div></main><script>
(() => {
  const form = document.querySelector('#gift-form');
  const steps = [...document.querySelectorAll('.step')];
  const name = document.querySelector('#name');
  const error = document.querySelector('#error');
  const data = { id: crypto.randomUUID(), model: '', size: '' };
  let current = 0, busy = false;
  function show(index) {
    current = index;
    error.hidden = true;
    steps.forEach((step, i) => { step.hidden = i !== index; });
    document.querySelectorAll('.progress span').forEach((el, i) => el.classList.toggle('done', i <= index));
    document.querySelector('.progress').setAttribute('aria-label', `Etapa ${index + 1} de 4`);
    if (index === 3) for (const key of ['name', 'model', 'size']) document.querySelector(`#review-${key}`).textContent = key === 'name' ? name.value.trim() : data[key];
    steps[index].querySelector('h2').focus({ preventScroll: true });
  }
  document.querySelectorAll('[data-model], [data-size]').forEach(button => {
    button.addEventListener('click', () => {
      const key = button.dataset.model ? 'model' : 'size';
      data[key] = button.dataset[key];
      document.querySelectorAll(`[data-${key}]`).forEach(el => el.setAttribute('aria-pressed', String(el === button)));
      show(current + 1);
    });
  });
  document.querySelectorAll('.back').forEach(button => button.addEventListener('click', () => { if (!busy) show(current - 1); }));
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    if (current === 0) {
      name.value = name.value.trim();
      if (!name.value) { name.reportValidity(); return; }
      show(1); return;
    }
    if (current !== 3) return;
    busy = true;
    const button = document.querySelector('#send');
    button.textContent = 'Enviando…';
    form.querySelectorAll('button').forEach(el => el.disabled = true);
    error.hidden = true;
    try {
      const response = await fetch('/api/presente', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...data, name: name.value.trim() }), signal: AbortSignal.timeout(20000) });
      if (!response.headers.get('content-type')?.includes('application/json')) throw new Error('O envio ainda não está disponível. Tente novamente mais tarde.');
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || 'Não foi possível enviar. Tente novamente.');
      document.querySelector('#success-name').textContent = name.value.trim();
      document.querySelector('#success-options').textContent = `${data.model === 'Feminino' ? 'Fem.' : 'Masc.'} · ${data.size}`;
      form.hidden = true;
      document.querySelector('.progress').hidden = true;
      document.querySelector('#success').hidden = false;
      document.querySelector('#success h2').focus({ preventScroll: true });
    } catch (err) {
      error.textContent = err.name === 'TimeoutError' || err instanceof TypeError ? 'Não foi possível confirmar o envio. Confira sua conexão e tente novamente.' : err.message;
      error.hidden = false;
    } finally {
      busy = false;
      button.textContent = 'Confirmar e enviar →';
      form.querySelectorAll('button').forEach(el => el.disabled = false);
    }
  });
})();

</script></body></html>
