<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Respostas | Gabriel Lopes</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/presente.css"><script src="/assets/respostas.js" defer></script></head><body><header><img src="/logo.png" alt="Gabriel Lopes"></header><main><section class="card" id="login"><span class="badge">Acesso privado</span><h1>Seus presentes.</h1><p>Entre para consultar as respostas.</p><form id="login-form"><label for="username">Usuário</label><input id="username" autocomplete="username" required style="margin-bottom:16px"><label for="password">Senha de acesso</label><input type="password" id="password" autocomplete="current-password" required><button class="primary">Entrar →</button></form></section><section id="dashboard" hidden><div class="toolbar"><h1>Respostas recebidas</h1><button class="quiet" id="logout">Sair</button></div><div class="toolbar"><span id="count" class="badge"></span><button class="quiet" id="refresh">Atualizar ↻</button></div><label for="search">Buscar por nome</label><input id="search" type="search" autocomplete="off"><div id="list" aria-live="polite"></div></section><p id="error" class="error" role="alert" hidden></p></main></body></html>
